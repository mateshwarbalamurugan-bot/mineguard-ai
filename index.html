<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="An offline-first simulated underground mine safety and intelligence demonstration." />
    <link rel="icon" type="image/svg+xml" href="/mineguard-mark.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Google Fonts: Orbitron, Rajdhani, JetBrains Mono, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <title>MINEGUARD AI — Autonomous Underground Robotics & Safety Intelligence</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mineguard-demo-v1');
          var isDark = true;
          if (saved) {
            var parsed = JSON.parse(saved);
            if (typeof parsed?.state?.darkMode === 'boolean') {
              isDark = parsed.state.darkMode;
            }
          } else if (window.matchMedia) {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('theme-dark');
          } else {
            document.documentElement.classList.remove('theme-dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
