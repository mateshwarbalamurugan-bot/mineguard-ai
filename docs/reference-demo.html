<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Board — Reference Demo (CDN Vue, no build step)</title>
  <!-- Vue 3 from CDN: no build step needed -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: #f2efe9;
  color: #111;
}

#app { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }

.top h1 { font-size: 2.4rem; margin: 0; letter-spacing: -0.02em; }
.sub { margin: 4px 0 20px; color: #666; font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; }

.card {
  background: #e9e6e0;
  border: 1px solid #d6d2ca;
  padding: 16px;
}

.form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.form h2 { margin: 0 0 4px; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.06em; }

input, textarea, select {
  width: 100%;
  padding: 10px;
  border: 1px solid #bdb8ae;
  background: #faf8f4;
  font: inherit;
}

.row { display: flex; gap: 8px; }

button {
  padding: 8px 14px;
  border: 1px solid #111;
  background: #111;
  color: #fff;
  font: inherit;
  cursor: pointer;
}
button:hover { opacity: 0.85; }
button.ghost { background: transparent; color: #111; }
button.danger { background: transparent; color: #d93025; border-color: #d93025; }

.toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
.toolbar select { width: 180px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.note h3 { margin: 0 0 8px; }
.note .body { white-space: pre-wrap; color: #333; margin: 0 0 12px; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 0.75rem;
  padding: 2px 8px;
  border: 1px solid #d93025;
  color: #d93025;
  cursor: pointer;
}

.error { color: #d93025; margin: 0; }
.empty { color: #666; }
  </style>
</head>
<body>
  <div id="app">
    <header class="top">
      <h1>Notes Board</h1>
      <p class="sub">{{ notes.length }} note{{ notes.length === 1 ? '' : 's' }}</p>
    </header>

    <!-- Create / Edit form -->
    <form class="card form" @submit.prevent="saveNote">
      <h2>{{ editingId ? 'Edit note' : 'New note' }}</h2>
      <input v-model="form.title" placeholder="Title" required />
      <textarea v-model="form.body" rows="4" placeholder="Write your note..."></textarea>
      <input v-model="form.tags" placeholder="Tags, comma separated (e.g. work, ideas)" />
      <p v-if="error" class="error">{{ error }}</p>
      <div class="row">
        <button type="submit">{{ editingId ? 'Update' : 'Add note' }}</button>
        <button v-if="editingId" type="button" class="ghost" @click="resetForm">Cancel</button>
      </div>
    </form>

    <!-- Search + tag filter -->
    <div class="toolbar">
      <input v-model="search" @input="loadNotes" placeholder="Search notes..." />
      <select v-model="activeTag" @change="loadNotes">
        <option value="">All tags</option>
        <option v-for="t in allTags" :key="t" :value="t">{{ t }}</option>
      </select>
    </div>

    <!-- Notes list -->
    <p v-if="!notes.length" class="empty">No notes yet. Add your first one above.</p>
    <div class="grid">
      <article v-for="n in notes" :key="n.id" class="card note">
        <h3>{{ n.title }}</h3>
        <p class="body">{{ n.body }}</p>
        <div class="tags">
          <span v-for="t in tagList(n)" :key="t" class="tag" @click="filterByTag(t)">{{ t }}</span>
        </div>
        <div class="row">
          <button class="ghost" @click="startEdit(n)">Edit</button>
          <button class="danger" @click="removeNote(n.id)">Delete</button>
        </div>
      </article>
    </div>
  </div>

  <script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      notes: [],
      allTags: [],        // every tag across all notes, for the dropdown
      search: '',
      activeTag: '',
      form: { title: '', body: '', tags: '' },
      editingId: null,    // null = creating, number = editing that note
      error: '',
    };
  },

  mounted() {
    this.loadNotes();
  },

  methods: {
    // Read: fetch notes (with optional search + tag filter)
    async loadNotes() {
      const params = new URLSearchParams();
      if (this.search) params.set('q', this.search);
      if (this.activeTag) params.set('tag', this.activeTag);
      const res = await fetch('/api/notes?' + params.toString());
      this.notes = await res.json();
      this.refreshTags();
    },

    // Build the tag dropdown from all notes (not just the filtered ones)
    async refreshTags() {
      const res = await fetch('/api/notes');
      const all = await res.json();
      const set = new Set();
      all.forEach((n) => this.tagList(n).forEach((t) => set.add(t)));
      this.allTags = [...set].sort();
    },

    tagList(note) {
      return note.tags ? note.tags.split(',') : [];
    },

    // Create or update, depending on editingId
    async saveNote() {
      this.error = '';
      const url = this.editingId ? `/api/notes/${this.editingId}` : '/api/notes';
      const method = this.editingId ? 'PUT' : 'POST';
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(this.form),
      });
      if (!res.ok) {
        const data = await res.json();
        this.error = data.error || 'Something went wrong';
        return;
      }
      this.resetForm();
      this.loadNotes();
    },

    startEdit(note) {
      this.editingId = note.id;
      this.form = { title: note.title, body: note.body, tags: note.tags };
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    resetForm() {
      this.editingId = null;
      this.form = { title: '', body: '', tags: '' };
      this.error = '';
    },

    async removeNote(id) {
      if (!confirm('Delete this note?')) return;
      await fetch(`/api/notes/${id}`, { method: 'DELETE' });
      if (this.editingId === id) this.resetForm();
      this.loadNotes();
    },

    filterByTag(tag) {
      this.activeTag = tag;
      this.loadNotes();
    },
  },
}).mount('#app');
  </script>
</body>
</html>
